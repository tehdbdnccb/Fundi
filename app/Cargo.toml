[package]
name = "fundi"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "fundi"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
axum = "0.7"
sqlx = { version = "0.7.3", features = ["postgres", "runtime-tokio-rustls", "uuid", "chrono", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4.35", features = ["serde"] }
uuid = { version = "1.6", features = ["serde", "v4"] }
ethers = "2.0.11"
base64 = "0.21"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }

[profile.release]
opt-level = 3
lto = true

